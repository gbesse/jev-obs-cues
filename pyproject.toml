[project]
name = "jev-obs-cues"
version = "0.1.0"
requires-python = ">=3.11"
license = { text = "MIT" }
description = "Finite, preview-first Jev scene cues for OBS Studio"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/jev_obs_cues.py" = ["E402"]

